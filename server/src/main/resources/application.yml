server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: legalmetrix-backend
  profiles:
    active: dev

  # Storage configuration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  name: LegalMetrix
  version: 1.0.0
  storage:
    upload-dir: ./uploads
    reports-dir: ./uploads/reports
    attachments-dir: ./uploads/attachments
  jwt:
    secret: "${JWT_SECRET:${APP_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}}"
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.metrologix: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

---
# Development profile (Embedded MySQL-compatible database for out-of-the-box execution)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/legalmetrix;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false # JPA ddl-auto update for dev, Flyway enabled in mysql profile
